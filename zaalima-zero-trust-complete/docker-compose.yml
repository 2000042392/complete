services:
  idp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/idp.db
      LEDGER_PATH: /app/data/did_ledger.json
      KEY_DIR: /app/data/keys
      REDIS_URL: redis://redis:6379/0
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8000}
    volumes:
      - idp_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.zaalima.rule=Host(`${PUBLIC_HOST:-localhost}`)
      - traefik.http.routers.zaalima.entrypoints=websecure
      - traefik.http.routers.zaalima.tls=true
      - traefik.http.routers.zaalima.tls.certresolver=letsencrypt
      - traefik.http.services.zaalima.loadbalancer.server.port=8000
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    command: ["redis-stack-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks: [edge]
    profiles: ["production"]
volumes:
  idp_data:
  redis_data:
  traefik_certs:
networks:
  backend:
  edge:
